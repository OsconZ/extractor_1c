<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Таймер обработки /api/sections/dispatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: #f6f7fb;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 32px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    p.subtitle {
      margin-top: 6px;
      color: #475569;
      font-size: 15px;
    }

    .upload {
      margin-top: 24px;
      padding: 20px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .upload input[type="file"] {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 10px;
    }

    .upload button {
      padding: 12px 16px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
    }

    /* ===== CLOCK ===== */

    .clock {
      width: 140px;
      height: 140px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px auto;
    }

    .clock__face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 30% 30%, #ffffff, #f1f5f9);
      border: 2px solid #e2e8f0;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.06),
        inset 0 2px 4px rgba(255, 255, 255, 0.6),
        inset 0 -2px 5px rgba(0, 0, 0, 0.05);
    }

    .clock__center {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #0f172a;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .clock__hand {
      position: absolute;
      width: 3px;
      left: 50%;
      top: 50%;
      transform-origin: 50% 100%;
      transform: translateX(-50%) translateY(-100%) rotate(0deg);
      border-radius: 4px;
      background: #0f172a;
    }

    .clock__hand--minute {
      height: 36%;
      animation: rotate-minute 8s linear infinite;
    }

    .clock__hand--second {
      height: 46%;
      background: #2563eb;
      box-shadow: 0 0 6px rgba(37, 99, 235, 0.6);
      animation: rotate-second 1.8s linear infinite;
    }

    .clock.paused .clock__hand {
      animation-play-state: paused !important;
    }

    @keyframes rotate-minute {
      from { transform: translateX(-50%) translateY(-100%) rotate(0deg); }
      to   { transform: translateX(-50%) translateY(-100%) rotate(360deg); }
    }

    @keyframes rotate-second {
      from { transform: translateX(-50%) translateY(-100%) rotate(0deg); }
      to   { transform: translateX(-50%) translateY(-100%) rotate(360deg); }
    }

    /* ===== TIME ===== */

    .time {
      font-size: 38px;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .hint {
      text-align: center;
      color: #475569;
      margin-top: 6px;
      margin-bottom: 20px;
    }

    .result {
      margin-top: 24px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 12px;
      max-height: 500px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
    }

  </style>
</head>

<body>

<div class="container">
  <h1>Таймер обработки</h1>
  <p class="subtitle">Измеряет точное время запроса к /api/sections/dispatch</p>

  <form class="upload" id="upload-form">
    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt,.rtf" />
    <button type="submit">Запустить</button>
  </form>

  <!-- CLOCK -->
  <div id="clock" class="clock paused">
    <div class="clock__face">
      <div class="clock__hand clock__hand--minute"></div>
      <div class="clock__hand clock__hand--second"></div>
      <div class="clock__center"></div>
    </div>
  </div>

  <div id="time" class="time">00:00.000</div>
  <p class="hint">Таймер работает, пока API выполняет обработку.</p>

  <pre id="result" class="result" style="display:none;"></pre>
</div>

<script>
  window.TIME_API = "http://localhost:8090";  // document_slicer

  const timeEl = document.getElementById("time");
  const clockEl = document.getElementById("clock");
  const resultEl = document.getElementById("result");

  let startedAt = null;
  let rafId = null;

  function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const seconds = String(totalSeconds % 60).padStart(2, '0');
    const milliseconds = String(Math.floor(ms % 1000)).padStart(3, '0');
    return `${minutes}:${seconds}.${milliseconds}`;
  }

  function tick(t) {
    if (!startedAt) return;
    timeEl.textContent = formatTime(t - startedAt);
    rafId = requestAnimationFrame(tick);
  }

  function startTimer() {
    startedAt = performance.now();
    clockEl.classList.remove("paused");
    rafId = requestAnimationFrame(tick);
  }

  function stopTimer(finalMs) {
    if (rafId) cancelAnimationFrame(rafId);
    timeEl.textContent = formatTime(finalMs);
    clockEl.classList.add("paused");
    startedAt = null;
  }

  document.getElementById("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    resultEl.style.display = "none";
    resultEl.textContent = "";

    const file = document.getElementById("file-input").files[0];
    if (!file) {
      alert("Выберите файл");
      return;
    }

    startTimer();

    const formData = new FormData();
    formData.append("file", file);

    const start = performance.now();

    try {
      const response = await fetch(`${window.TIME_API}/api/sections/dispatch`, {
        method: "POST",
        body: formData
      });

      const end = performance.now();
      stopTimer(end - start);

      if (!response.ok) {
        resultEl.style.display = "block";
        resultEl.textContent = "Ошибка: " + (await response.text());
        return;
      }

      const json = await response.json();
      resultEl.style.display = "block";
      resultEl.textContent = JSON.stringify(json, null, 2);

    } catch (err) {
      const end = performance.now();
      stopTimer(end - start);
      resultEl.style.display = "block";
      resultEl.textContent = "Ошибка: " + err.message;
    }
  });
</script>

</body>
</html>
