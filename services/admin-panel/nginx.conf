server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;


    location = /time {
        try_files /time.html =404;
    }

    location = /time.html {
        try_files /time.html =404;
    }

    # Все остальные пути приложения → index.html (SPA)
    location / {
        try_files $uri /index.html;
    }
}
